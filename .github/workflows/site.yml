name: Data and site

on:
  push:
    branches: [main]
    paths-ignore: ['README.md']
  workflow_dispatch:
    inputs:
      refresh:
        description: 'Re-pull EIA data before building'
        type: boolean
        default: true
  schedule:
    - cron: '23 9 * * 1' # weekly, Mondays

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      REFRESH: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.refresh) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Restore EIA pull cache
        if: env.REFRESH == 'true'
        uses: actions/cache@v4
        with:
          path: pipeline/cache
          key: eia-cache-${{ github.run_id }}
          restore-keys: eia-cache-

      - name: Pull EIA data and build site data
        if: env.REFRESH == 'true'
        env:
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
        run: |
          pip install -r pipeline/requirements.txt
          python -m pipeline.fetch_eia
          python -m pipeline.fetch_eia930_bulk
          python -m pipeline.build_datacenters
          python -m pipeline.build_site_data
          python -m pipeline.validate

      - name: Commit refreshed data
        if: env.REFRESH == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data
          git diff --cached --quiet || git commit -m "Refresh EIA data and rebuild site data [skip ci]"
          git push

      - name: Check data is present
        id: data
        run: |
          if [ -f public/data/meta.json ]; then echo "ok=true" >> "$GITHUB_OUTPUT"; else echo "ok=false" >> "$GITHUB_OUTPUT"; echo "::warning::public/data/meta.json is missing. Run this workflow manually with refresh enabled."; fi

      - uses: actions/setup-node@v4
        if: steps.data.outputs.ok == 'true'
        with:
          node-version: 22
          cache: npm

      - name: Build site
        if: steps.data.outputs.ok == 'true'
        run: |
          npm ci
          npm run build

      - uses: actions/configure-pages@v5
        if: steps.data.outputs.ok == 'true'
      - uses: actions/upload-pages-artifact@v3
        if: steps.data.outputs.ok == 'true'
        with:
          path: dist
      - name: Deploy to GitHub Pages
        id: deployment
        if: steps.data.outputs.ok == 'true'
        uses: actions/deploy-pages@v4
